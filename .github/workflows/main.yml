name: CI/CD Android & iOS

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: Android
            os: ubuntu-latest
            build-cmd: flutter build apk --release
            artifact-name: android-apk
            artifact-path: build/app/outputs/flutter-apk/app-release.apk
            setup-java: true
          - platform: iOS
            os: macos-latest
            build-cmd: flutter build ios --release --no-codesign
            artifact-name: ios-ipa
            artifact-path: build/ios/iphoneos/app-release.ipa
            setup-java: false
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        if: matrix.setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run pigeon --input pigeons/api.dart

      - name: Build ${{ matrix.platform }}
        run: ${{ matrix.build-cmd }}

      - name: Create IPA
        if: matrix.platform == 'iOS'
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r app-release.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
