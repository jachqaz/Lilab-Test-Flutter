name: CI/CD con FVM

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    name: Run Tests with FVM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup FVM
        uses: kuhnroyal/flutter-fvm-config-action@v2

      - name: Install dependencies
        run: fvm flutter pub get

      - name: Generate code
        run: |
          fvm dart run build_runner build --delete-conflicting-outputs
          fvm dart run pigeon --input pigeons/api.dart

      - name: Run tests
        run: fvm flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info

  build_all:
    name: Build All Platforms
    needs: test
    strategy:
      matrix:
        include:
          - platform: web
            os: ubuntu-latest
            build-cmd: flutter build web --release
            artifact-path: build/web/

          - platform: android
            os: ubuntu-latest
            build-cmd: flutter build apk --release
            artifact-path: build/app/outputs/flutter-apk/app-release.apk

          - platform: ios
            os: macos-latest
            build-cmd: flutter build ios --release --no-codesign
            artifact-path: build/ios/iphoneos/

          - platform: windows
            os: windows-latest
            build-cmd: flutter build windows --release
            artifact-path: build/windows/x64/runner/Release/

          - platform: macos
            os: macos-latest
            build-cmd: flutter build macos --release
            artifact-path: build/macos/Build/Products/Release/

          - platform: linux
            os: ubuntu-latest
            build-cmd: flutter build linux --release
            artifact-path: build/linux/x64/release/bundle/
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup FVM
        uses: kuhnroyal/flutter-fvm-config-action@v2

      - name: Install dependencies
        run: fvm flutter pub get

      - name: Generate code
        run: |
          fvm dart run build_runner build --delete-conflicting-outputs
          fvm dart run pigeon --input pigeons/api.dart

      - name: Build ${{ matrix.platform }}
        run: fvm ${{ matrix.build-cmd }}

      - name: Upload ${{ matrix.platform }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: ${{ matrix.artifact-path }}
