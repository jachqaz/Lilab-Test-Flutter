name: CI/CD Android & iOS con FVM

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup FVM
        uses: kuhnroyal/flutter-fvm-config-action@v2

      - name: Install dependencies
        run: fvm flutter pub get

      - name: Generate code
        run: |
          fvm dart run build_runner build --delete-conflicting-outputs
          fvm dart run pigeon --input pigeons/api.dart

      - name: Run tests
        run: fvm flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info

  build_android:
    name: Build Android APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup FVM
        uses: kuhnroyal/flutter-fvm-config-action@v2

      - name: Install dependencies
        run: fvm flutter pub get

      - name: Generate code
        run: |
          fvm dart run build_runner build --delete-conflicting-outputs
          fvm dart run pigeon --input pigeons/api.dart

      - name: Build APK
        run: fvm flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_ios:
    name: Build iOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup FVM
        uses: kuhnroyal/flutter-fvm-config-action@v2

      - name: Install dependencies
        run: fvm flutter pub get

      - name: Generate code
        run: |
          fvm dart run build_runner build --delete-conflicting-outputs
          fvm dart run pigeon --input pigeons/api.dart

      - name: Build iOS (no codesign)
        run: fvm flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r app-release.ipa Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/iphoneos/app-release.ipa
