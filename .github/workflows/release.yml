name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

  build_and_release:
    name: Build and Release
    needs: create_release
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            asset_name: social_challenge.apk
            asset_path: build/app/outputs/flutter-apk/app-release.apk
            content_type: application/vnd.android.package-archive

          - platform: windows
            os: windows-latest
            asset_name: social_challenge_windows.zip
            asset_path: build/windows/social_challenge_windows.zip
            content_type: application/zip

          - platform: macos
            os: macos-latest
            asset_name: social_challenge_macos.zip
            asset_path: social_challenge_macos.zip
            content_type: application/zip

          - platform: linux
            os: ubuntu-latest
            asset_name: social_challenge_linux.tar.gz
            asset_path: social_challenge_linux.tar.gz
            content_type: application/gzip
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run pigeon --input pigeons/api.dart

      - name: Build Android
        if: matrix.platform == 'android'
        run: flutter build apk --release

      - name: Build Windows
        if: matrix.platform == 'windows'
        run: |
          flutter build windows --release
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/windows/social_challenge_windows.zip

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: |
          flutter build macos --release
          cd build/macos/Build/Products/Release
          zip -r social_challenge_macos.zip social_challenge.app
          mv social_challenge_macos.zip ../../../../../

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: |
          flutter build linux --release
          cd build/linux/x64/release/bundle
          tar -czf social_challenge_linux.tar.gz *
          mv social_challenge_linux.tar.gz ../../../../../

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ matrix.asset_path }}
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: ${{ matrix.content_type }}
